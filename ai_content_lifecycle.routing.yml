ai_content_lifecycle.settings:
  path: '/admin/config/ai/ai-content-lifecycle'
  defaults:
    _form: '\Drupal\ai_content_lifecycle\Form\ContentLifecycleSettingsForm'
    _title: 'AI Content Lifecycle'
  requirements:
    _permission: 'administer ai content lifecycle settings'

ai_content_lifecycle.batch_create:
  path: '/admin/config/ai/ai-content-lifecycle/batch-create'
  defaults:
    _controller: '\Drupal\ai_content_lifecycle\Controller\ContentLifecycleBatchController::batchCreate'
    _title: 'Create Content Lifecycle Elements'
  requirements:
    _permission: 'administer ai content lifecycle settings'
